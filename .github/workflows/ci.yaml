name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so changes in the corpus zones, in Unbound or in advisories
    # show up.
    - cron: '17 5 * * 1'
  workflow_dispatch:

# Jobs only read the repository. Actions are pinned to commits, with the
# release in a comment; Dependabot proposes updates.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
      - run: flutter pub get
      - run: dart analyze lib test tool hook
      - run: flutter test --coverage -x network
        env:
          # The weekly run fuzzes the validator much longer.
          FUZZ_ITERATIONS: ${{ github.event_name == 'schedule' && '200000' || '5000' }}
      # Lists untested lines per file; fails if the validation code drops
      # below its floor (tool/coverage.dart).
      - run: dart run tool/coverage.dart

  mutants:
    # Plants each of ~30 bugs in the security checks and expects the tests
    # to catch every one (tool/mutants.dart). Weekly, as it takes minutes.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
      - run: flutter pub get
      - run: dart run tool/mutants.dart

  differential:
    # Compares the validator with Unbound on ~950 live lookups; see
    # tool/differential.dart.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
      - run: sudo apt-get update && sudo apt-get install -y unbound-host
      - run: flutter pub get
      # unbound-host exits 0 also on SERVFAIL, so look for the answer.
      - name: Check that unbound-host can resolve
        run: |
          for attempt in 1 2 3; do
            unbound-host -C tool/unbound-host.conf -t SOA . | tee "$RUNNER_TEMP/soa.txt"
            if grep -q 'has SOA record' "$RUNNER_TEMP/soa.txt"; then exit 0; fi
            sleep 5
          done
          echo "::error::unbound-host cannot resolve the root zone from this runner"
          exit 1
      # Exit code 2 is a run spoiled by the network (too many unanswered
      # lookups, or so slow that it stalled); it is retried once, and if that
      # is spoiled too, it warns instead of failing, as root-anchors does:
      # the runner's DNS is at times very slow on both sides. A real
      # disagreement (1) fails at once.
      - name: Compare with Unbound
        run: |
          for attempt in 1 2; do
            code=0
            dart run tool/differential.dart --server 9.9.9.9 --unbound-config tool/unbound-host.conf || code=$?
            if [ "$code" -ne 2 ]; then exit "$code"; fi
            if [ "$attempt" -eq 2 ]; then
              echo "::warning::Both differential runs were unreliable (network, or they stalled); no result"
              exit 0
            fi
            echo "::warning::Differential run $attempt was unreliable (network, or it stalled); retrying"
            sleep 60
          done

  root-anchors:
    # The built-in root trust anchors against IANA's list, so a root key
    # rollover or revocation fails a (weekly) run; see tool/root_anchors.dart.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
      - run: flutter pub get
      # Exit code 2 is a fetch that failed; it warns instead of failing.
      - name: Compare with IANA
        run: |
          code=0
          dart run tool/root_anchors.dart || code=$?
          if [ "$code" -eq 2 ]; then
            echo "::warning::Could not fetch IANA's root anchors"
            exit 0
          fi
          exit "$code"

  native:
    # The C shim on its own, with -Werror and the address and undefined
    # behaviour sanitizers, against each platform's libresolv.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Strict warnings
        run: >-
          cc -std=gnu11 -Wall -Wextra -Wconversion -Wsign-conversion -Wshadow
          -Wformat=2 -pedantic -Werror -O2 -D_FORTIFY_SOURCE=2
          -fstack-protector-strong -Isrc -c src/tlsa_resolver.c -o /dev/null
      - name: Sanitized test
        run: |
          mkdir -p build
          cc -std=gnu11 -Wall -Wextra -Werror -g -fno-omit-frame-pointer \
            -fsanitize=address,undefined -fno-sanitize-recover=all -Isrc \
            src/tlsa_resolver.c test/native/shim_test.c -lresolv -o build/shim_test
          build/shim_test

  osv:
    # Known vulnerabilities in the resolved dependencies.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
      # The library's pubspec.lock is not committed; resolve it as a user
      # of the package would. flutter pub get also resolves example/.
      - run: flutter pub get && (cd device_test && flutter pub get)
      - uses: google/osv-scanner-action/osv-scanner-action@32d3cd482bdadfb38b186c0ad1b031902d55d932 # v2.7.1
        with:
          scan-args: |-
            -L
            pubspec.lock
            -L
            example/pubspec.lock
            -L
            device_test/pubspec.lock
