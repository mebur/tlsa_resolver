# A caching, non-validating Unbound for tool/differential.dart: every
# unbound-host run otherwise starts with an empty cache and resolves from
# the root again. Validation stays in unbound-host (see forward.conf).
#
#   unbound -c tool/unbound/cache.conf &
server:
  interface: 127.0.0.1
  port: 5300
  access-control: 127.0.0.0/8 allow
  do-daemonize: no
  username: ""
  chroot: ""
  pidfile: ""
  use-syslog: no
  # Recursion only; it passes signatures through for unbound-host to check.
  module-config: "iterator"
  msg-cache-size: 64m
  rrset-cache-size: 128m
