name: tlsa_resolver
description: "Resolve DNS TLSA records with local DNSSEC validation through the system resolver, and match certificates against them (DANE)."
version: 0.1.0

environment:
  sdk: ^3.13.3

dependencies:
  code_assets: ^1.1.0
  crypto: ^3.0.8
  ed25519_edwards: ^0.3.2
  ffi: ^2.2.0
  hooks: ^2.0.0
  logging: ^1.3.0
  native_toolchain_c: ^0.19.0
  pointycastle: ^4.0.0

dev_dependencies:
  flutter_lints: ^6.0.0
  test: ^1.28.0
